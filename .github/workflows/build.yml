name: Build e publicar instaladores

# Dispara sempre que uma tag de versão é enviada, por exemplo: v1.0.0
on:
  push:
    tags:
      - "v*.*.*"
  # Também permite rodar manualmente pela aba "Actions" no GitHub, sem publicar
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_script: dist:win
          - os: macos-latest
            build_script: dist:mac
          - os: ubuntu-latest
            build_script: dist:linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Compilar app (Vite + TypeScript)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Gerar instalador
        run: >
          npx electron-builder
          ${{ matrix.os == 'windows-latest' && '--win' || matrix.os == 'macos-latest' && '--mac' || '--linux' }}
          --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sem certificado de desenvolvedor Apple: evita que o build do macOS
          # falhe tentando assinar o app automaticamente.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Guardar instaladores como artefato (builds manuais, sem tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v6
        with:
          name: instaladores-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore
